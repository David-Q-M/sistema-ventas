<div class="login-container">
  <!-- Background Overlay -->
  <div class="background-overlay"></div>

  <!-- Corporate Glass Card -->
  <div class="login-card">
    <div class="login-brand-header text-center">
      <div class="brand-badge-circle">
        <i class="bi bi-cart-fill"></i>
      </div>
      <h2>Sistema de Ventas</h2>
      <p class="subtitle">Gestión eficiente y confiable</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username Input -->
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" class="form-control" [(ngModel)]="credentials.username" name="username" required
            placeholder="Ej: admin" autocomplete="username">
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required
            placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <!-- Error Alert -->
      <div *ngIf="error" class="alert alert-danger text-center">
        <i class="bi bi-exclamation-circle-fill me-1"></i> {{ error }}
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-login w-100" [disabled]="loading">
        <span *ngIf="!loading">Ingresar al Sistema <i class="bi bi-arrow-right-short"></i></span>
        <span *ngIf="loading" class="spinner-container">
          <span class="spinner-dot"></span>
          <span class="spinner-dot"></span>
          <span class="spinner-dot"></span>
        </span>
      </button>
    </form>
  </div>
</div>
