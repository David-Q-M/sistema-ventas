<div class="layout-wrapper" [class.sidebar-closed]="!sidebarOpen">
  <app-loading></app-loading>
  <app-toast></app-toast>

  <!-- Sidebar Component -->
  <aside class="sidebar">
    <div class="sidebar-brand-top">
      <div class="brand-logo-icon">
        <i class="bi bi-cart-fill"></i>
      </div>
      <div class="brand-text">
        <h3 class="brand-title">Sistema de Ventas</h3>
        <span class="brand-subtitle">Gestión eficiente y confiable</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <i class="bi bi-grid-1x2-fill icon"></i>
        <span>Dashboard</span>
      </a>

      <a *ngIf="role === 'ADMIN' || role === 'ALMACENERO'" routerLink="/productos" routerLinkActive="active"
        class="nav-item">
        <i class="bi bi-box-seam-fill icon"></i>
        <span>Productos</span>
      </a>

      <a *ngIf="role === 'ADMIN' || role === 'ALMACENERO'" routerLink="/inventario" routerLinkActive="active"
        class="nav-item">
        <i class="bi bi-boxes icon"></i>
        <span>Inventario</span>
      </a>

      <a *ngIf="role === 'ADMIN'" routerLink="/proveedores" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people-fill icon"></i>
        <span>Proveedores</span>
      </a>

      <a *ngIf="role === 'ADMIN' || role === 'ALMACENERO'" routerLink="/compras" routerLinkActive="active"
        class="nav-item">
        <i class="bi bi-plus-circle-fill icon"></i>
        <span>Registrar Compra</span>
      </a>

      <a *ngIf="role === 'ADMIN' || role === 'CAJERO'" routerLink="/ventas" routerLinkActive="active" class="nav-item">
        <i class="bi bi-cart-check-fill icon"></i>
        <span>Ventas</span>
      </a>

      <a *ngIf="role === 'ADMIN'" routerLink="/usuarios" routerLinkActive="active" class="nav-item">
        <i class="bi bi-person-gear icon"></i>
        <span>Usuarios</span>
      </a>

      <!-- Submenu / Section: Reportes y Consultas -->
      <div *ngIf="role === 'ADMIN' || role === 'ALMACENERO'" class="nav-group">
        <div class="nav-group-header">
          <i class="bi bi-pie-chart-fill icon"></i>
          <span>Reportes y Consultas</span>
          <i class="bi bi-chevron-down arrow"></i>
        </div>
        <div class="nav-sub-items">
          <a routerLink="/compras" routerLinkActive="active" class="nav-sub-item">
            <i class="bi bi-journal-text icon"></i>
            <span>Historial de Compras</span>
          </a>
          <a *ngIf="role === 'ADMIN'" routerLink="/reportes" routerLinkActive="active" class="nav-sub-item">
            <i class="bi bi-graph-up-arrow icon"></i>
            <span>Estadísticas de Ventas</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="logout-btn">
        <i class="bi bi-box-arrow-left icon"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Workspace Area -->
  <main class="main-content">
    <!-- Topbar Navigation -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" (click)="toggleSidebar()" title="Alternar menú">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <div class="topbar-right">
        <div class="user-profile-badge">
          <div class="user-avatar-circle">
            <i class="bi bi-person"></i>
          </div>
          <span class="user-role-label">{{ role || 'USUARIO' }}</span>
          <i class="bi bi-chevron-down dropdown-arrow"></i>
        </div>
      </div>
    </header>

    <!-- Page Content Container -->
    <div class="content-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
