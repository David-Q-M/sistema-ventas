# Configuración para Base de Datos Local (MariaDB via HeidiSQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_ventas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# REEMPLAZA ESTO por la contraseña que pusiste al instalar MariaDB en tu PC (HeidiSQL/XAMPP suele ser root sin contraseña)
spring.datasource.password=231157

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect (Se autodetecta automáticamente)

# Desactivar carga automática de archivos
spring.sql.init.mode=never
